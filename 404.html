<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Trong Tran</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #09090b;
        color: #e0e0e5;
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 32rem;
      }
      .code {
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #7c9bff;
      }
      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        font-weight: 600;
        color: #fff;
      }
      p {
        margin: 0 0 2rem;
        color: #9696a1;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0.7rem 1.2rem;
        border-radius: 999px;
        background: #2f5fe8;
        color: #fff;
        font-weight: 500;
        text-decoration: none;
        transition: background 150ms;
      }
      a:hover {
        background: #2449c4;
      }
      a:focus-visible {
        outline: 2px solid #7c9bff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">Error 404</div>
      <h1>This page doesn’t exist.</h1>
      <p>
        The link may be broken or the page may have moved. Everything lives on
        the main portfolio page.
      </p>
      <a href="%BASE_URL%">← Back to the portfolio</a>
    </main>
  </body>
</html>
